<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIF STUDIO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font-family:system-ui,sans-serif;padding:22px 16px}main{max-width:560px;margin:auto}h1{text-align:center;margin:18px 0 5px}header p{text-align:center;color:#aab7cb;margin-bottom:26px}.panel{background:#202c3d;border-radius:18px;padding:20px;margin:14px 0}label{display:block;margin:14px 0 7px;font-weight:650}input,select,button{font:inherit}input[type=file]{width:100%;font-size:14px}input[type=number],select{width:100%;padding:12px;border-radius:10px;border:1px solid #546277;background:#101827;color:white}video,img{width:100%;max-height:330px;object-fit:contain;border-radius:12px;background:#080c13}video{margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,.download{display:block;width:100%;border:0;border-radius:12px;background:#5b87f5;color:white;padding:14px;text-align:center;font-weight:700;text-decoration:none;margin-top:16px}button:disabled{opacity:.5}small,.hint{color:#aab7cb;line-height:1.5}#status{white-space:pre-wrap;line-height:1.5}#result{display:none}#output{margin-top:14px}progress{width:100%;height:16px}a{color:#a8c6ff}
</style>
</head>
<body><main>
<header><h1>GIF STUDIO</h1><p>20MB 이하 고화질 움짤 제작기</p></header>
<section class="panel">
<label for="file">1. MP4 영상 선택</label>
<input id="file" type="file" accept="video/mp4,video/*">
<video id="video" controls playsinline preload="auto" style="display:none"></video>
<p class="hint">원하는 최대 10초 구간을 선택하세요. 영상은 서버에 업로드되지 않습니다. 변환 중에는 화면을 켜 두세요.</p>
<div class="grid"><div><label for="start">시작 (초)</label><input id="start" type="number" min="0" step="0.1" value="0"></div><div><label for="end">끝 (초)</label><input id="end" type="number" min="0.1" step="0.1" value="4"></div></div>
<div class="grid"><div><label for="width">가로 해상도</label><select id="width"><option value="480">480px (추천)</option><option value="360">360px</option><option value="640">640px</option></select></div><div><label for="fps">프레임</label><select id="fps"><option value="20">20 FPS (추천)</option><option value="15">15 FPS</option><option value="30">30 FPS</option></select></div></div>
<label><input type="checkbox" id="auto" checked> 20MB 이하 자동 재시도</label>
<button id="convert" disabled>GIF 만들기</button>
<p id="status" role="status">영상을 선택해 주세요.</p><progress id="progress" value="0" max="100" style="display:none"></progress>
</section>
<section class="panel" id="result"><h2>변환 결과</h2><p id="size"></p><img id="output" alt="완성된 GIF"><a class="download" id="download" download="gif-studio.gif">GIF 저장하기</a></section>
<p class="hint">GIF는 최대 256색으로 제한됩니다. 실제 프레임 수는 휴대폰의 영상 재생 성능에 따라 달라질 수 있습니다. 20MB를 넘으면 해상도 또는 프레임 설정을 낮춰 다시 변환합니다.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const video=$('video');
const MAX=20*1000*1000;
let sourceURL=null,resultURL=null,busy=false;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

$('file').addEventListener('change',()=>{
 if(busy)return;
 const file=$('file').files[0];if(!file)return;
 video.pause();
 if(sourceURL)URL.revokeObjectURL(sourceURL);
 sourceURL=URL.createObjectURL(file);
 video.src=sourceURL;video.load();video.style.display='block';
 $('convert').disabled=true;$('status').textContent='영상 정보를 읽는 중...';$('result').style.display='none';
});
video.addEventListener('loadedmetadata',()=>{
 if(!Number.isFinite(video.duration)||video.duration<=0){$('status').textContent='영상 길이를 읽을 수 없습니다.';return}
 $('start').value='0';$('end').value=Math.min(4,video.duration).toFixed(1);
 $('convert').disabled=false;$('status').textContent='구간을 선택하고 GIF 만들기를 누르세요.';
});

// Android 브라우저의 누락된 seeked 이벤트와 이미 목표에 도착한 상황을 처리합니다.
// 근접한 시간만으로 성공 처리하지 않고 실제 디코딩 준비 상태도 확인합니다.
async function seekOnce(target){
 const safeTarget=Math.max(0,Math.min(target,video.duration-0.01));
 const closeEnough=()=>!video.seeking&&video.readyState>=2&&
  Number.isFinite(video.currentTime)&&Math.abs(video.currentTime-safeTarget)<0.25;
 if(closeEnough())return;
 let lastError=null;
 for(let attempt=0;attempt<2;attempt++){
  try{
   await new Promise((resolve,reject)=>{
    let done=false;
    const started=Date.now();
    let timer=null;
    function cleanup(){clearInterval(timer);video.removeEventListener('seeked',check);video.removeEventListener('loadeddata',check);video.removeEventListener('canplay',check);video.removeEventListener('error',onError)}
    function finish(err){if(done)return;done=true;cleanup();err?reject(err):resolve()}
    function check(){if(closeEnough())finish();else if(Date.now()-started>12000)finish(new Error('영상 탐색 대기 시간이 초과되었습니다.'))}
    function onError(){finish(new Error('영상 위치 이동 중 재생 오류가 발생했습니다.'))}
    video.addEventListener('seeked',check);
    video.addEventListener('loadeddata',check);
    video.addEventListener('canplay',check);
    video.addEventListener('error',onError);
    timer=setInterval(check,150);
    try{video.currentTime=safeTarget;check()}catch(e){finish(new Error('영상 위치 이동이 지원되지 않습니다.'))}
   });
   return;
  }catch(e){lastError=e;if(attempt===0){video.pause();await wait(400)}}
 }
 throw new Error('시작 위치로 이동하지 못했습니다. '+(lastError?lastError.message:''));
}

function encode(frames,delay,quality){return new Promise((resolve,reject)=>{
 const gif=new GIF({workers:2,quality,workerScript:'./gif.worker.js'});
 frames.forEach(frame=>gif.addFrame(frame,{copy:true,delay}));
 gif.on('finished',resolve);
 gif.on('abort',()=>reject(new Error('인코딩이 중단되었습니다.')));
 gif.on('progress',p=>{$('progress').value=55+Math.round(p*45)});
 try{gif.render()}catch(e){reject(e)}
})}

async function capture(start,end,width,fps){
 const h=Math.max(2,Math.round(width*video.videoHeight/video.videoWidth/2)*2);
 const canvas=document.createElement('canvas');canvas.width=width;canvas.height=h;
 const ctx=canvas.getContext('2d');
 if(!ctx)throw new Error('화면 캡처를 시작할 수 없습니다.');
 const frames=[];
 const total=Math.max(1,Math.ceil((end-start)*fps));
 const interval=1/fps;
 let nextTime=start;
 let lastTime=-1;
 let frameCallbackId=null;
 let rafId=null;
 let watchdog=null;
 let completed=false;
 const oldMuted=video.muted;
 const oldRate=video.playbackRate;
 video.pause();video.muted=true;video.playbackRate=1;
 try{
  $('status').textContent=`${start}초 위치로 이동 중...`;
  await seekOnce(start);
  if(video.readyState<2)await wait(150);
  $('status').textContent='영상을 재생하면서 프레임을 수집하는 중...';
  await new Promise((resolve,reject)=>{
   function cleanup(){
    clearTimeout(watchdog);
    if(frameCallbackId!==null&&video.cancelVideoFrameCallback)video.cancelVideoFrameCallback(frameCallbackId);
    if(rafId!==null)cancelAnimationFrame(rafId);
    video.removeEventListener('error',onError);
    video.removeEventListener('ended',onEnded);
   }
   function finish(err){if(completed)return;completed=true;cleanup();video.pause();err?reject(err):resolve()}
   function onError(){finish(new Error('영상 재생 중 오류가 발생했습니다.'))}
   function onEnded(){finish(frames.length?null:new Error('프레임을 읽지 못했습니다.'))}
   function saveFrame(t){
    if(completed)return;
    if(t<start-0.12)return;
    if(t>=end+0.08){finish();return}
    if(t+0.025<nextTime)return;
    if(t<=lastTime+0.00001)return;
    lastTime=t;
    try{
     ctx.drawImage(video,0,0,width,h);
     const copy=document.createElement('canvas');copy.width=width;copy.height=h;
     copy.getContext('2d').drawImage(canvas,0,0);
     frames.push(copy);
    }catch(e){finish(new Error('영상 프레임을 캡처하지 못했습니다.'));return}
    nextTime=start+frames.length*interval;
    $('progress').value=Math.min(54,Math.round((Math.min(t,end)-start)/(end-start)*55));
    if(frames.length>=total||t>=end-interval*0.5)finish();
   }
   function onVideoFrame(now,metadata){
    if(completed)return;
    saveFrame(metadata.mediaTime);
    if(!completed)frameCallbackId=video.requestVideoFrameCallback(onVideoFrame);
   }
   function onAnimationFrame(){
    if(completed)return;
    saveFrame(video.currentTime);
    if(!completed)rafId=requestAnimationFrame(onAnimationFrame);
   }
   video.addEventListener('error',onError);
   video.addEventListener('ended',onEnded);
   watchdog=setTimeout(()=>finish(new Error('프레임 수집 시간이 초과되었습니다.')),Math.max(18000,(end-start)*6000));
   try{
    if(typeof video.requestVideoFrameCallback==='function')frameCallbackId=video.requestVideoFrameCallback(onVideoFrame);
    else rafId=requestAnimationFrame(onAnimationFrame);
    Promise.resolve(video.play()).catch(()=>finish(new Error('영상 자동 재생을 시작하지 못했습니다. 브라우저에서 재생을 허용해 주세요.')));
   }catch(e){finish(new Error('영상 자동 재생을 시작하지 못했습니다. 브라우저에서 재생을 허용해 주세요.'))}
  });
  if(frames.length<2)throw new Error('움직이는 GIF를 만들 프레임이 부족합니다.');
  const delay=Math.max(20,Math.round((end-start)*1000/frames.length));
  return {frames,delay,actualFps:frames.length/(end-start)};
 }finally{video.pause();video.muted=oldMuted;video.playbackRate=oldRate}
}

$('convert').addEventListener('click',async()=>{
 if(busy||!video.videoWidth)return;
 const start=Number($('start').value),end=Number($('end').value);
 if(!Number.isFinite(start)||!Number.isFinite(end)||start<0||end<=start||end>video.duration+0.01){alert('시작·종료 시간을 확인해 주세요.');return}
 if(end-start>10){alert('스마트폰 안정성을 위해 우선 10초 이하로 선택해 주세요.');return}
 busy=true;$('convert').disabled=true;$('file').disabled=true;
 $('result').style.display='none';$('progress').style.display='block';$('progress').value=0;
 let w=Number($('width').value),fps=Number($('fps').value);
 try{
  if(typeof GIF==='undefined')throw new Error('GIF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
  let blob,usedFps=0;
  for(let n=0;n<5;n++){
   $('progress').value=0;
   $('status').textContent=`${n+1}차 변환: ${w}px / 목표 ${fps}FPS`;
   const captured=await capture(start,end,w,fps);
   usedFps=captured.actualFps;
   $('status').textContent=`${w}px · 실제 약 ${usedFps.toFixed(1)}FPS 인코딩 중...`;
   blob=await encode(captured.frames,captured.delay,10);
   if(blob.size<=MAX)break;
   if(!$('auto').checked)throw new Error(`결과가 ${(blob.size/1000000).toFixed(1)}MB로 제한을 초과했습니다. 설정을 낮춰주세요.`);
   if(w>360)w=w>=640?480:360;
   else if(fps>15)fps=fps>=30?20:15;
   else throw new Error('20MB 이하로 줄이지 못했습니다. 구간을 더 짧게 선택해 주세요.');
   if(n===4)throw new Error('20MB 이하로 줄이지 못했습니다.');
  }
  if(resultURL)URL.revokeObjectURL(resultURL);
  resultURL=URL.createObjectURL(blob);
  $('output').src=resultURL;$('download').href=resultURL;
  $('size').textContent=`${(blob.size/1000000).toFixed(2)}MB · ${w}px · 실제 약 ${usedFps.toFixed(1)}FPS`;
  $('result').style.display='block';$('status').textContent='완료! 아래에서 GIF를 저장하세요.';$('progress').value=100;
 }catch(e){$('status').textContent='변환 실패: '+e.message;console.error(e)}
 finally{busy=false;$('convert').disabled=false;$('file').disabled=false}
});
</script>
</body></html>
