<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF STUDIO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font-family:system-ui,sans-serif;padding:22px 16px}main{max-width:560px;margin:auto}h1{text-align:center;margin:18px 0 5px}header p{text-align:center;color:#aab7cb;margin-bottom:26px}.panel{background:#202c3d;border-radius:18px;padding:20px;margin:14px 0}label{display:block;margin:14px 0 7px;font-weight:650}input,select,button{font:inherit}input[type=file]{width:100%;font-size:14px}input[type=number],select{width:100%;padding:12px;border-radius:10px;border:1px solid #546277;background:#101827;color:white}video,img{width:100%;max-height:330px;object-fit:contain;border-radius:12px;background:#080c13}video{margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,.download{display:block;width:100%;border:0;border-radius:12px;background:#5b87f5;color:white;padding:14px;text-align:center;font-weight:700;text-decoration:none;margin-top:16px}button:disabled{opacity:.5}small,.hint{color:#aab7cb;line-height:1.5}#status{white-space:pre-wrap;line-height:1.5}#result{display:none}#output{margin-top:14px}progress{width:100%;height:16px}a{color:#a8c6ff}
</style>
</head>
<body><main>
<header><h1>GIF STUDIO</h1><p>20MB 이하 고화질 움짤 제작기</p></header>
<section class="panel">
<label for="file">1. MP4 영상 선택</label>
<input id="file" type="file" accept="video/mp4,video/*">
<video id="video" controls playsinline preload="metadata" style="display:none"></video>
<p class="hint">처음에는 3~5초짜리 구간으로 테스트하세요. 영상은 서버에 업로드되지 않습니다.</p>
<div class="grid"><div><label for="start">시작 (초)</label><input id="start" type="number" min="0" step="0.1" value="0"></div><div><label for="end">끝 (초)</label><input id="end" type="number" min="0.1" step="0.1" value="4"></div></div>
<div class="grid"><div><label for="width">가로 해상도</label><select id="width"><option value="480">480px (추천)</option><option value="360">360px</option><option value="640">640px</option></select></div><div><label for="fps">프레임</label><select id="fps"><option value="20">20 FPS (추천)</option><option value="15">15 FPS</option><option value="30">30 FPS</option></select></div></div>
<label><input type="checkbox" id="auto" checked> 20MB 이하 자동 재시도</label>
<button id="convert" disabled>GIF 만들기</button>
<p id="status" role="status">영상을 선택해 주세요.</p><progress id="progress" value="0" max="100" style="display:none"></progress>
</section>
<section class="panel" id="result"><h2>변환 결과</h2><p id="size"></p><img id="output" alt="완성된 GIF"><a class="download" id="download" download="gif-studio.gif">GIF 저장하기</a></section>
<p class="hint">GIF는 원본보다 색상이 줄어들 수 있습니다. 20MB를 맞출 수 없는 경우 다운로드 대신 안내가 표시됩니다. 변환 중에는 화면을 켜 두세요.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script>
const $=id=>document.getElementById(id);
let sourceURL=null,resultURL=null,busy=false;
const MAX=20*1000*1000;
const video=$('video');
$('file').addEventListener('change',()=>{
 const file=$('file').files[0];if(!file)return;
 if(sourceURL)URL.revokeObjectURL(sourceURL);
 sourceURL=URL.createObjectURL(file);video.src=sourceURL;video.style.display='block';
 $('convert').disabled=true;$('status').textContent='영상 정보를 읽는 중...';$('result').style.display='none';
});
video.addEventListener('loadedmetadata',()=>{
 if(!Number.isFinite(video.duration)){$('status').textContent='영상 길이를 읽을 수 없습니다.';return}
 $('start').value='0';$('end').value=Math.min(4,video.duration).toFixed(1);
 $('convert').disabled=false;$('status').textContent='구간을 선택하고 GIF 만들기를 누르세요.';
});

function seek(t) {
  return new Promise((resolve, reject) => {
    const target = Math.min(
      Math.max(t, 0),
      Math.max(0, video.duration - 0.001)
    );

    let timer;
    let settled = false;

    function cleanup() {
      clearTimeout(timer);
      video.removeEventListener('seeked', done);
      video.removeEventListener('error', fail);
    }

    function done() {
      if (settled) return;
      settled = true;
      cleanup();
      resolve();
    }

    function fail() {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('영상을 읽을 수 없습니다.'));
    }

    video.addEventListener('seeked', done);
    video.addEventListener('error', fail);

    timer = setTimeout(() => {
      fail();
    }, 20000);

    try {
      if (!video.seeking &&
          Math.abs(video.currentTime - target) < 0.001 &&
          video.readyState >= 2) {
        done();
      } else {
        video.currentTime = target;
      }
    } catch (e) {
      fail();
    }
  });
}

function encode(frames,w,h,delay,quality){return new Promise((resolve,reject)=>{
 const gif=new GIF({workers:2,quality,workerScript:'./gif.worker.js'});
 frames.forEach(c=>gif.addFrame(c,{copy:true,delay}));
 gif.on('finished',resolve);gif.on('abort',()=>reject(new Error('인코딩이 중단되었습니다.')));
 gif.on('progress',p=>{$('progress').value=55+Math.round(p*45)});
 try{gif.render()}catch(e){reject(e)}
})}
async function attempt(start,end,width,fps){
 const h=Math.max(2,Math.round(width*video.videoHeight/video.videoWidth/2)*2);
 const canvas=document.createElement('canvas');canvas.width=width;canvas.height=h;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});
 const count=Math.max(1,Math.ceil((end-start)*fps));const frames=[];
 for(let i=0;i<count;i++){
  const t=start+i/fps;await seek(Math.min(t,end-0.001));
  ctx.drawImage(video,0,0,width,h);
  const copy=document.createElement('canvas');copy.width=width;copy.height=h;
  copy.getContext('2d').drawImage(canvas,0,0);frames.push(copy);
  $('progress').value=Math.round((i+1)/count*55);
  if(i%5===0)await new Promise(r=>setTimeout(r,0));
 }
 $('status').textContent=`${width}px · ${fps}fps 인코딩 중...`;
 return await encode(frames,width,h,Math.round(1000/fps),10);
}
$('convert').addEventListener('click',async()=>{
 if(busy||!video.videoWidth)return;
 const start=Number($('start').value),end=Number($('end').value);
 if(!Number.isFinite(start)||!Number.isFinite(end)||start<0||end<=start||end>video.duration+0.01){alert('시작·종료 시간을 확인해 주세요.');return}
 if(end-start>10){alert('스마트폰 안정성을 위해 우선 10초 이하로 선택해 주세요.');return}
 busy=true;$('convert').disabled=true;$('result').style.display='none';$('progress').style.display='block';
 let w=Number($('width').value),fps=Number($('fps').value);
 try{
  if(typeof GIF==='undefined')throw new Error('GIF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
  let blob;
  for(let n=0;n<5;n++){
   $('progress').value=0;$('status').textContent=`${n+1}차 변환: ${w}px / ${fps}fps`;
   blob=await attempt(start,end,w,fps);
   if(blob.size<=MAX)break;
   if(!$('auto').checked)throw new Error(`결과가 ${(blob.size/1000000).toFixed(1)}MB로 제한을 초과했습니다. 설정을 낮춰주세요.`);
   if(w>360)w=w===640?480:360;
   else if(fps>15)fps=fps===30?20:15;
   else throw new Error('20MB 이하로 줄이지 못했습니다. 구간을 더 짧게 선택해 주세요.');
   if(n===4)throw new Error('20MB 이하로 줄이지 못했습니다.');
  }
  if(resultURL)URL.revokeObjectURL(resultURL);resultURL=URL.createObjectURL(blob);
  $('output').src=resultURL;$('download').href=resultURL;
  $('size').textContent=`${(blob.size/1000000).toFixed(2)}MB · ${w}px · ${fps}fps`;
  $('result').style.display='block';$('status').textContent='완료! 아래에서 GIF를 저장하세요.';$('progress').value=100;
 }catch(e){$('status').textContent='변환 실패: '+e.message+'\n영상 구간을 2~3초로 줄여 다시 시도해 주세요.';console.error(e)}
 finally{busy=false;$('convert').disabled=false}
});
</script>
</body></html>
